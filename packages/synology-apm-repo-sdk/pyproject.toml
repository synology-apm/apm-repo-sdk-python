[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synology-apm-repo-sdk"
version = "0.1.0"
description = "Offline, read-only Python SDK for Synology APM/APV/Object-Storage dedup repository formats"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Synology Inc." },
]
requires-python = ">=3.11"
keywords = ["synology", "activeprotect", "backup", "apm", "dedup", "sdk"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "zstandard>=0.22",
    "lz4>=4.3",
    "cryptography>=42.0",
    "icalendar>=5.0",
    "aiosqlite>=0.20",
    "aioboto3>=13.0",
    "azure-storage-blob>=12.19",
    "aiohttp>=3.9",
    "keyring>=25.0",
    "smbprotocol>=1.15",
    "dissect.volume>=3.18",
    "dissect.ntfs>=3.16",
    "dissect.extfs>=3.15",
    "dissect.xfs>=3.13",
    "dissect.btrfs>=1.10",
    "dissect.fat>=3.13",
    "dissect.apfs>=1.1",
]

[project.urls]
Homepage = "https://www.synology.com/products/ActiveProtectAppliance"
Repository = "https://github.com/synology-apm/apm-repo-sdk-python"
Documentation = "https://synology-apm.github.io/apm-repo-sdk-python/"
"Issue Tracker" = "https://github.com/synology-apm/apm-repo-sdk-python/issues"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
