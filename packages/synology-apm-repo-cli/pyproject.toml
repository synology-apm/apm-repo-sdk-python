[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synology-apm-repo-cli"
version = "0.2.0"
description = "Command-line browser/exporter for Synology APM/APV/Object-Storage dedup repositories, built on synology-apm-repo-sdk"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Synology Inc." },
]
requires-python = ">=3.11"
keywords = ["synology", "activeprotect", "backup", "apm", "dedup", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "synology-apm-repo-sdk==0.2.0",
    "typer>=0.12,<0.28",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://www.synology.com/products/ActiveProtectAppliance"
Repository = "https://github.com/synology-apm/apm-repo-sdk-python"
"Issue Tracker" = "https://github.com/synology-apm/apm-repo-sdk-python/issues"

[project.scripts]
synology-apm-repo-cli = "synology_apm_repo.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.uv.sources]
synology-apm-repo-sdk = { workspace = true }
