# Builds synology-apm-repo-sdk, synology-apm-repo-cli and
# synology-apm-repo-browser for the pushed `vX.Y.Z` tag and publishes them
# to PyPI, then as one GitHub release:
# - `verified`: looks for ci.yml's push or scheduled run on the tagged
#   commit. Passed: CI is not repeated. Still running: waits for it.
#   Failed: stops the release. Cancelled, absent or unreadable: `ci` runs.
# - `ci`: the whole of ci.yml (workflow_call), only when `verified` says so.
# - `advisories`: `make audit-advisories` every time, so a release that
#   reuses an older CI run still sees today's advisories.
# - `gate`: passes only when all three did; everything after it needs it.
# - `build`, `verify-dist`: the wheels and sdists with their `.sha256`,
#   installed and run before anything is published.
# - `publish-*`: PyPI (trusted publishing), the SDK first.
# - `github-release`: once every PyPI upload succeeded, checks every file
#   against its `.sha256` and the tag's version, then one GitHub release.
# A job after one that may be skipped (`ci`) is skipped too unless its
# `if:` says otherwise, hence `!cancelled() && needs.X.result == 'success'`.
# Actions are pinned to commit SHAs; see .github/CLAUDE.md.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read   # jobs that need more elevate their own

# One release at a time, whatever the tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verified:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      ci: ${{ steps.check.outputs.ci }}
    steps:
      - id: check
        name: Look for a CI run on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          out() { echo "ci=$1" >> "$GITHUB_OUTPUT"; }
          # Newest first. Pull-request runs test a merge commit, not this one.
          run=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "schedule")] | .[0] // empty | "\(.id) \(.status)"') || {
            echo "::warning::Could not list the CI runs of $SHA; running CI"; out run; exit 0; }
          if [ -z "$run" ]; then
            echo "No push or scheduled CI run on $SHA; running CI"; out run; exit 0
          fi
          read -r id status <<< "$run"
          if [ "$status" != completed ]; then
            echo "Waiting for CI run $id ($status)"
            gh run watch "$id" --interval 30 > /dev/null || true
          fi
          conclusion=$(gh run view "$id" --json conclusion --jq .conclusion) || {
            echo "::warning::Could not read CI run $id; running CI"; out run; exit 0; }
          case "$conclusion" in
            success) echo "CI run $id passed on $SHA"; out skip ;;
            cancelled) echo "CI run $id was cancelled; running CI"; out run ;;
            *) echo "::error::CI run $id on $SHA concluded '$conclusion'"; exit 1 ;;
          esac

  ci:
    needs: verified
    if: needs.verified.outputs.ci == 'run'
    uses: ./.github/workflows/ci.yml

  advisories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Advisories (make audit-advisories)
        run: make audit-advisories

  gate:
    if: always()
    needs: [verified, ci, advisories]
    runs-on: ubuntu-latest
    steps:
      - name: Verified or tested, and no advisory
        env:
          VERIFIED: ${{ needs.verified.result }}
          DECISION: ${{ needs.verified.outputs.ci }}
          CI: ${{ needs.ci.result }}
          ADVISORIES: ${{ needs.advisories.result }}
        run: |
          echo "verified=$VERIFIED ($DECISION) ci=$CI advisories=$ADVISORIES"
          [ "$VERIFIED" = success ] && [ "$ADVISORIES" = success ] || exit 1
          case "$DECISION/$CI" in
            skip/skipped | run/success) ;;
            *) exit 1 ;;
          esac

  build:
    needs: gate
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [sdk, cli, browser]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Build synology-apm-repo-${{ matrix.package }}
        run: uv build --package synology-apm-repo-${{ matrix.package }} -o dist/synology-apm-repo-${{ matrix.package }}

      # Beside the dist, not in it: PyPI takes every file of packages-dir.
      - name: Checksums of synology-apm-repo-${{ matrix.package }}
        run: |
          mkdir sha256
          cd dist/synology-apm-repo-${{ matrix.package }}
          for f in *; do sha256sum -- "$f" > "../../sha256/$f.sha256"; done

      - name: Upload synology-apm-repo-${{ matrix.package }} dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synology-apm-repo-${{ matrix.package }}
          path: dist/synology-apm-repo-${{ matrix.package }}/

      - name: Upload synology-apm-repo-${{ matrix.package }} checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256-synology-apm-repo-${{ matrix.package }}
          path: sha256/

  # The wheels are installed and exercised before anything reaches PyPI —
  # PyPI uploads are immutable, so a broken artifact would burn the version.
  verify-dist:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Each artifact lands in dist/<artifact name>/, i.e. dist/synology-apm-repo-<package>/.
      - name: Download every package's dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: synology-apm-repo-*
          path: dist

      - name: Verify wheel versions match the tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          ls dist/synology-apm-repo-sdk/synology_apm_repo_sdk-"$V"-py3-none-any.whl
          ls dist/synology-apm-repo-cli/synology_apm_repo_cli-"$V"-py3-none-any.whl
          ls dist/synology-apm-repo-browser/synology_apm_repo_browser-"$V"-py3-none-any.whl

      - name: Install wheels and smoke-run the CLI
        run: |
          python3 -m venv .venv-smoke-cli
          .venv-smoke-cli/bin/pip install --quiet \
            dist/synology-apm-repo-sdk/*.whl dist/synology-apm-repo-cli/*.whl
          .venv-smoke-cli/bin/python -c "import synology_apm_repo.sdk, synology_apm_repo.cli"
          .venv-smoke-cli/bin/synology-apm-repo-cli --help

      - name: Install wheels and smoke-run the browser TUI
        run: |
          python3 -m venv .venv-smoke-browser
          .venv-smoke-browser/bin/pip install --quiet \
            dist/synology-apm-repo-sdk/*.whl dist/synology-apm-repo-browser/*.whl
          .venv-smoke-browser/bin/python -c "import synology_apm_repo.sdk, synology_apm_repo.browser"
          .venv-smoke-browser/bin/synology-apm-repo-browser --help

  publish-sdk:
    needs: [build, verify-dist]
    if: ${{ !cancelled() && needs.verify-dist.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi-synology-apm-repo-sdk
      url: https://pypi.org/p/synology-apm-repo-sdk
    permissions:
      id-token: write
    steps:
      - name: Download synology-apm-repo-sdk dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: synology-apm-repo-sdk
          path: dist/synology-apm-repo-sdk

      - name: Publish synology-apm-repo-sdk to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/synology-apm-repo-sdk

  publish-cli:
    needs: [build, publish-sdk]
    if: ${{ !cancelled() && needs.publish-sdk.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi-synology-apm-repo-cli
      url: https://pypi.org/p/synology-apm-repo-cli
    permissions:
      id-token: write
    steps:
      - name: Download synology-apm-repo-cli dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: synology-apm-repo-cli
          path: dist/synology-apm-repo-cli

      - name: Publish synology-apm-repo-cli to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/synology-apm-repo-cli

  # publish-browser runs in parallel with publish-cli — both depend only on publish-sdk.
  publish-browser:
    needs: [build, publish-sdk]
    if: ${{ !cancelled() && needs.publish-sdk.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi-synology-apm-repo-browser
      url: https://pypi.org/p/synology-apm-repo-browser
    permissions:
      id-token: write
    steps:
      - name: Download synology-apm-repo-browser dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: synology-apm-repo-browser
          path: dist/synology-apm-repo-browser

      - name: Publish synology-apm-repo-browser to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/synology-apm-repo-browser

  # Last, so a release is announced only once every package is on PyPI.
  github-release:
    needs: [publish-sdk, publish-cli, publish-browser]
    if: >-
      ${{ !cancelled() && needs.publish-sdk.result == 'success' &&
      needs.publish-cli.result == 'success' && needs.publish-browser.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download every package's dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: synology-apm-repo-*
          path: dist
          merge-multiple: true

      - name: Download every package's checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sha256-*
          path: dist
          merge-multiple: true

      - name: Check the files
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum -c -- *.sha256
          for sum in *.sha256; do
            case "$sum" in
              *-"${TAG#v}"-* | *-"${TAG#v}".tar.gz.sha256) ;;
              *) echo "::error::$sum is not version ${TAG#v}"; exit 1 ;;
            esac
          done

      - name: Create the release
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes "" dist/*
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
