# Auto-merges Dependabot security-update PRs once the required `test` status check
# (from ci.yml) passes. Relies on repository Settings prerequisites and gates on the
# PR author alone -- see .github/CLAUDE.md's "Dependabot Auto-Merge" section for why
# that's sufficient and what it stops being sufficient for.
name: Dependabot auto-merge (security updates)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
